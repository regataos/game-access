name: Update Epic Games Weekly Free Game

on:
  schedule:
    # A Epic vira os jogos às 11:00 EST/EDT: 15:00 UTC (verão EUA) ou 16:00 UTC (inverno EUA).
    # Minutos quebrados reduzem a fila de jobs agendados no GitHub Actions.
    # Quinta-feira às 16:17 UTC (13:17 BRT) — logo após a rotação mesmo no inverno dos EUA
    - cron: '17 16 * * 4'
    # Reforço na quinta-feira às 18:42 UTC (15:42 BRT)
    - cron: '42 18 * * 4'
    # Contingência na sexta-feira às 00:19 UTC (21:19 BRT de quinta)
    - cron: '19 0 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-free-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Checkout repository scripts
        uses: actions/checkout@v4
        with:
          path: main-repo
          sparse-checkout: |
            .github/scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and generate free game script
        run: |
          python3 main-repo/.github/scripts/update_free_game.py gh-pages/games-blocks-online.js

      - name: Commit and Push changes
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p images
          git add games-blocks-online.js images/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração no jogo gratuito semanal."
          else
            git commit -m "Automated update of Epic Games weekly free game and cached images"
            git push origin gh-pages
          fi
